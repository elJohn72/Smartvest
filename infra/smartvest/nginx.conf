user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;

        # Bloquear archivos sensibles, SQL, migraciones, scripts y configuraciones
        location ~* \.(sql|env|ini|log|sh|example|git|md|yml|yaml)$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Bloquear explícitamente cualquier acceso directo a archivos en /api/ excepto api/v1/index.php
        # Bloquea users.php, iot.php, dashboard.php, address.php, worker.php, config.php, etc.
        location ~* ^/api/(?!v1(/|$)) {
            return 404;
        }

        # Enrutar API v1 hacia el Front Controller
        location /api/v1 {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/api/v1/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param SCRIPT_NAME /api/v1/index.php;
        }

        # Enrutar página pública de emergencia /emergency/{token}
        location ~ ^/emergency/ {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/api/v1/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param SCRIPT_NAME /api/v1/index.php;
        }

        # Denegar ejecución directa de cualquier otro archivo PHP fuera de los autorizados
        location ~ \.php$ {
            return 404;
        }
    }
}
