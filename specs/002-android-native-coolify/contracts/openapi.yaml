openapi: 3.1.0
info:
  title: SmartVest API v1
  version: 1.1.0
  description: API v1 independiente y segura para SmartVest (Android nativo y Coolify Lab).
servers:
  - url: https://smartvest-lab.ajenzasas.com/api/v1
    description: Servidor de laboratorio Coolify
  - url: http://localhost:8080/api/v1
    description: Servidor local de pruebas

paths:
  /health/live:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Servicio vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/ready:
    get:
      summary: Readiness check (verifica base de datos)
      responses:
        '200':
          description: Base de datos y migraciones listas
        '503':
          description: Base de datos no disponible

  /auth/register:
    post:
      summary: Registro controlado de laboratorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Cuenta de laboratorio creada
        '409':
          description: Usuario ya existe

  /auth/login:
    post:
      summary: Inicio de sesión cuidador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token de sesión emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401':
          description: Credenciales inválidas

  /auth/logout:
    post:
      summary: Cierre de sesión y revocación de token
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Sesión revocada
        '401':
          description: No autorizado

  /me:
    get:
      summary: Obtener datos de la cuenta actual
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos de cuenta
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }

  /profiles:
    post:
      summary: Crear perfil de persona asistida
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presentationName]
              properties:
                presentationName: { type: string }
                emergencyPhone: { type: string }
                bloodType: { type: string }
                medicalObservations: { type: string }
      responses:
        '201':
          description: Perfil creado

  /profiles/{id}:
    get:
      summary: Obtener perfil por ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detalle del perfil
        '404':
          description: Perfil no encontrado o ajeno
    patch:
      summary: Actualizar perfil propio
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                presentationName: { type: string }
                emergencyPhone: { type: string }
                bloodType: { type: string }
                medicalObservations: { type: string }
      responses:
        '200':
          description: Perfil actualizado
        '404':
          description: Perfil no encontrado
    delete:
      summary: Eliminar perfil propio
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Perfil eliminado y chaleco desvinculado

  /profiles/{id}/device:
    post:
      summary: Vincular chaleco a perfil con código de un solo uso
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, pairingCode]
              properties:
                deviceId: { type: string }
                pairingCode: { type: string }
      responses:
        '200':
          description: Chaleco vinculado
        '400':
          description: Código inválido o expirado
        '409':
          description: Chaleco ya asignado

  /profiles/{id}/shares:
    post:
      summary: Generar enlace / token QR consentido
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowedFields]
              properties:
                allowedFields:
                  type: array
                  items:
                    type: string
                    enum: [presentationName, emergencyPhone, bloodType]
      responses:
        '201':
          description: Token QR generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareId: { type: string }
                  token: { type: string }
                  publicUrl: { type: string }

  /profiles/{id}/shares/{shareId}:
    delete:
      summary: Revocar token QR
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: shareId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: QR revocado

  /public/emergency/{token}:
    get:
      summary: Datos mínimos de emergencia para lector de QR
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Campos permitidos consentidos
        '404':
          description: Token no existe o revocado

  /emergency/{token}:
    get:
      summary: Página HTML accesible de emergencia
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML de emergencia
          content:
            text/html:
              schema: { type: string }
        '404':
          description: No encontrado o revocado

  /devices/{deviceId}/state:
    get:
      summary: Estado actual de telemetría del chaleco
      security:
        - BearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Última lectura válida o null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    properties:
                      deviceId: { type: string }
                      distanceCm: { type: number, nullable: true }
                      gpsFix: { type: boolean }
                      latitude: { type: number, nullable: true }
                      longitude: { type: number, nullable: true }
                      batteryLevel: { type: integer, nullable: true }
                      sosActive: { type: boolean }
                      lastUpdate: { type: integer }

  /devices/{deviceId}/history:
    get:
      summary: Historial de telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 120 }
      responses:
        '200':
          description: Lista de lecturas históricas

  /devices/{deviceId}/telemetry:
    post:
      summary: Ingestión de telemetría física desde ESP32
      security:
        - DeviceApiKey: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, bootId, sequence, sosActive]
              properties:
                deviceId: { type: string }
                bootId: { type: string, format: uuid }
                sequence: { type: integer, minimum: 0 }
                distanceCm: { type: number, nullable: true }
                gpsFix: { type: boolean }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
                batteryLevel: { type: integer, nullable: true }
                sosActive: { type: boolean }
                sosEventId: { type: string, format: uuid, nullable: true }
      responses:
        '202':
          description: Telemetría persistida
        '200':
          description: Telemetría duplicada o descartada
        '401':
          description: Credencial de dispositivo incorrecta
        '400':
          description: Payload inválido

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
    DeviceApiKey:
      type: apiKey
      in: header
      name: X-SmartVest-Api-Key
